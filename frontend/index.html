<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button, select { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    nav button { background: none; border: none; color: #f5f5f4; cursor: pointer; font-size: 1em; }
    nav button.active { text-decoration: underline; font-weight: bold; }
    .badge { background: #b45309; color: #fff7ed; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; }
    .card { border: 1px solid #57534e; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    .muted { color: #a8a29e; }
    .delta { font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav hidden id="nav">
      <button id="nav-shift">班测</button>
      <button id="nav-comp">通风对照</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <div id="page-shift">
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>ID</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div id="page-comp" hidden>
        <form id="comp-form" class="card">
          <strong>钉一条通风对照</strong>
          <p class="muted">选一条本机班测，再按主键（ID）引入另一条参照班测，填写通风间隔分钟。</p>
          <p>
            <select id="comp-local"></select>
            <input id="comp-ref" type="number" min="1" placeholder="参照班测 ID" />
            <input id="comp-min" type="number" min="1" step="1" placeholder="通风间隔分钟" />
            <button>钉定存档</button>
          </p>
          <p id="comp-msg" class="alarm"></p>
        </form>
        <div id="comp-list"></div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
